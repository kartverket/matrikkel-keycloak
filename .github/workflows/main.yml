name: Deploy to All Environments

on:
  push:
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-string.outputs.version }}
      image: ${{ steps.version-string.outputs.image }}
      schedulerImage: ${{ steps.version-string.outputs.schedulerImage }}

    steps:
      - name: Generate version string
        id: version-string
        shell: bash
        run: |
          version="$(date -u '+%Y.%m.%d-%H.%M')-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/kartverket/matrikkel-keycloak:${version}" >> "$GITHUB_OUTPUT"
          echo "schedulerImage=ghcr.io/kartverket/matrikkel-keycloak-scheduler:${version}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: Run tests
        working-directory: ./extensions
        run: ./gradlew integrationTest

  package-image:
    name: Build and (conditionally) Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - version
      - test
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v7
        env:
          image: ${{ needs.version.outputs.image }}
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.image }}

  package-scheduler-image:
    name: Build and (conditionally) Push Docker SchedulerImage
    runs-on: ubuntu-latest
    needs:
      - version
      - test
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v7
        env:
          image: ${{ needs.version.outputs.schedulerImage }}
        with:
          context: skipJobbScheduler/
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.image }}

  pharos:
    name: Run Pharos
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - package-image
      - package-scheduler-image
    uses: ./.github/workflows/sikkerhetsscanning_images.yml

  deploy-dev:
    name: Update Keycloak Version in Dev
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs:
      - version
      - package-image
      - package-scheduler-image
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak
      image_name: ghcr.io/kartverket/matrikkel-keycloak
      image_tag: ${{ needs.version.outputs.version }}
      image_digest: ${{ needs.package-image.outputs.digest }}
      cluster: atkv3
      env: dev
      namespace: mat-brukeradmin-keycloak-dev
      identity: matrikkel-keycloak

  deploy-dev-scheduler:
    name: Update Scheduler Version in Dev
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs:
      - version
      - package-scheduler-image
      - deploy-dev
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-scheduler
      image_name: ghcr.io/kartverket/matrikkel-keycloak-scheduler
      image_tag: ${{ needs.version.outputs.version }}
      image_digest: ${{ needs.package-scheduler-image.outputs.digest }}
      cluster: atkv3
      env: dev
      namespace: mat-brukeradmin-keycloak-dev
      identity: matrikkel-keycloak

