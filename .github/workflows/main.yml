name: Deploy to All Environments

on:
  push:
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-string.outputs.version }}
      image: ${{ steps.version-string.outputs.image }}
      schedulerImage: ${{ steps.version-string.outputs.schedulerImage }}

    steps:
      - name: Generate version string
        id: version-string
        shell: bash
        run: |
          version="$(date -u '+%Y.%m.%d-%H.%M')-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/kartverket/mat-brukeradmin-keycloak:${version}" >> "$GITHUB_OUTPUT"
          echo "schedulerImage=ghcr.io/kartverket/mat-brukeradmin-keycloak-scheduler:${version}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: Run tests
        working-directory: ./extensions
        run: ./gradlew integrationTest

  package-image:
    name: Build and (conditionally) Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - version
      - test
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v7
        env:
          image: ${{ needs.version.outputs.image }}
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.image }}
      - name: Tag commit med artifaktversjon
        run: |
          git tag ${{ needs.version.outputs.version }}
          git push origin ${{ needs.version.outputs.version }}

  package-scheduler-image:
    name: Build and (conditionally) Push Docker SchedulerImage
    runs-on: ubuntu-latest
    needs:
      - version
      - test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        env:
          image: ${{ needs.version.outputs.schedulerImage }}
        with:
          context: skipJobbScheduler/
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.image }}

  pharos:
    name: Run Pharos
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - package-image
      - package-scheduler-image
    uses: ./.github/workflows/sikkerhetsscanning_images.yml

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - version
      - package-image
      - package-scheduler-image
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Deploy matrikkel-keycloak to dev
        uses: kartverket/matrikkel-actions/apps-repo-deploy@main
        env:
          version: ${{ needs.version.outputs.version }}
        with:
          apps: |
            atkv3-dev:mat-brukeradmin-keycloak-dev:mat-brukeradmin-keycloak:${{ env.version }}
            atkv3-dev:mat-brukeradmin-keycloak-dev:mat-brukeradmin-keycloak-scheduler:${{ env.version }}
          identity: 'matrikkel-keycloak'

  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - version
      - package-image
      - package-scheduler-image
      - deploy-dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Deploy matrikkel-keycloak to QA environments
        uses: kartverket/matrikkel-actions/apps-repo-deploy@main
        env:
          version: ${{ needs.version.outputs.version }}
        with:
          apps: |
            atkv3-prod:mat-brukeradmin-keycloak-betatest:mat-brukeradmin-keycloak:${{ env.version }}
            atkv3-prod:mat-brukeradmin-keycloak-betatest:mat-brukeradmin-keycloak-scheduler:${{ env.version }}
            atkv3-prod:mat-brukeradmin-keycloak-prodtest:mat-brukeradmin-keycloak:${{ env.version }}
            atkv3-prod:mat-brukeradmin-keycloak-prodtest:mat-brukeradmin-keycloak-scheduler:${{ env.version }}
          identity: 'matrikkel-keycloak'

