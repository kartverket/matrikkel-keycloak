name: Deploy to All Environments

on:
  push:
    branches:
      - main
    paths-ignore: &ignore_paths
      - '.github/**'
      - '.security/**'
      - '**/*.md'
      - '.gitignore'
      - 'catalog-info.yaml'
      - 'docker-compose.yaml'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore: *ignore_paths
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/kartverket/matrikkel-keycloak
  SCHEDULER_IMAGE_NAME: ghcr.io/kartverket/matrikkel-keycloak-scheduler

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version-string.outputs.new_version }}

    steps:
      - name: Generate version string
        id: version-string
        shell: bash
        run: |
          current_time="$(date '+%Y.%m.%d-%H.%M')"
          git_short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "new_version=${current_time}-${git_short_sha}" >> $GITHUB_OUTPUT

  test:
    name: Run extensions tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: gradle
          check-latest: 'true'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Run extensions tests
        working-directory: ./extensions
        run: ./gradlew integrationTest

  package-image:
    name: Build and (conditionally) Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - version
      - test
    outputs:
      image_name: ${{ env.IMAGE_NAME }}
      scheduler_image_name: ${{ env.SCHEDULER_IMAGE_NAME }}
      image_digest: ${{ steps.build-image.outputs.digest }}
      scheduler_image_digest: ${{ steps.build-scheduler-image.outputs.digest }}
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to dhi.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_version }}

      - name: Build Scheduler Docker image
        id: build-scheduler-image
        uses: docker/build-push-action@v7
        with:
          context: skipJobbScheduler/
          push: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.SCHEDULER_IMAGE_NAME }}:${{ needs.version.outputs.new_version }}

  tag-release:
    name: "Tag commit med artifaktversjon"
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    needs:
      - version
      - package-image
    permissions:
      contents: write
    steps:
      - name: "Create git tag"
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${NEW_VERSION}" \
            -f "sha=${GITHUB_SHA}"

  deploy-dev:
    name: "Deploy to dev"
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    needs:
      - version
      - package-image
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      version: ${{ needs.version.outputs.new_version }}
    steps:
      - name: "Update apps repo keycloak (dev)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atkv3-dev
          namespace: mat-brukeradmin-keycloak-dev
          image_name: ${{ needs.package-image.outputs.image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.image_digest }}
          application_name: matrikkel-keycloak
          identity: matrikkel-keycloak
      - name: "Update apps repo keycloak scheduler (dev)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atkv3-dev
          namespace: mat-brukeradmin-keycloak-dev
          image_name: ${{ needs.package-image.outputs.scheduler_image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.scheduler_image_digest }}
          application_name: matrikkel-keycloak-scheduler
          identity: matrikkel-keycloak
      - name: "Verify deployment to DEV"
        uses: kartverket/bygning-github-workflows/bygning-k8s-deployment-feedback@main
        with:
          cluster: atkv3-dev
          apps: |
            mat-brukeradmin-keycloak-dev:matrikkel-keycloak:${{ env.version }}

  deploy-betatest-prodtest:
    name: "Deploy to betatest/prodtest"
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    needs:
      - version
      - package-image
      - tag-release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      version: ${{ needs.version.outputs.new_version }}
    steps:
      - name: "Update apps repo keycloak (betatest)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atkv3-prod
          namespace: mat-brukeradmin-keycloak-betatest
          image_name: ${{ needs.package-image.outputs.image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.image_digest }}
          application_name: matrikkel-keycloak
          identity: matrikkel-keycloak
      - name: "Update apps repo keycloak scheduler (betatest)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atkv3-prod
          namespace: mat-brukeradmin-keycloak-betatest
          image_name: ${{ needs.package-image.outputs.scheduler_image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.scheduler_image_digest }}
          application_name: matrikkel-keycloak-scheduler
          identity: matrikkel-keycloak
      - name: "Update apps repo keycloak (prodtest)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atkv3-prod
          namespace: mat-brukeradmin-keycloak-prodtest
          image_name: ${{ needs.package-image.outputs.image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.image_digest }}
          application_name: matrikkel-keycloak
          identity: matrikkel-keycloak
      - name: "Update apps repo keycloak scheduler (prodtest)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atkv3-prod
          namespace: mat-brukeradmin-keycloak-prodtest
          image_name: ${{ needs.package-image.outputs.scheduler_image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.scheduler_image_digest }}
          application_name: matrikkel-keycloak-scheduler
          identity: matrikkel-keycloak
      - name: "Verify deployment to betatest/prodtest"
        uses: kartverket/bygning-github-workflows/bygning-k8s-deployment-feedback@main
        with:
          cluster: atkv3-prod
          apps: |
            mat-brukeradmin-keycloak-betatest:matrikkel-keycloak:${{ env.version }}
            mat-brukeradmin-keycloak-prodtest:matrikkel-keycloak:${{ env.version }}

  deploy-prod-notifier:
    name: "Slack Notify: Deployment to prod"
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      actions: read
      contents: read
      id-token: write
    needs:
      - version
      - package-image
      - deploy-betatest-prodtest
    env:
      version: ${{ needs.version.outputs.new_version }}
    outputs:
      messageId: ${{ steps.slack_notify.outputs.messageId }}
    steps:
      - name: "Slack Notify: Deployment to prod"
        id: slack_notify
        uses: kartverket/bygning-github-workflows/bygning-approval-notifier/setup@main
        with:
          identity: matrikkel-keycloak
          environment: prod
          appDescriptor: atkv3-prod:mat-brukeradmin-keycloak-prod:matrikkel-keycloak:${{ env.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy-prod:
    name: "Deploy to prod"
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    needs:
      - version
      - package-image
      - deploy-prod-notifier
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: production
    env:
      version: ${{ needs.version.outputs.new_version }}
    steps:
      - name: "Slack Notify: Deployment to prod (Update)"
        uses: kartverket/bygning-github-workflows/bygning-approval-notifier/update@main
        with:
          identity: matrikkel-keycloak
          environment: "prod"
          appDescriptor: atkv3-prod:mat-brukeradmin-keycloak-prod:matrikkel-keycloak:${{ env.version }}
          messageId: ${{ needs.deploy-prod-notifier.outputs.messageId }}
          status: ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: "Update apps repo keycloak (prod)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atkv3-prod
          namespace: mat-brukeradmin-keycloak-prod
          image_name: ${{ needs.package-image.outputs.image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.image_digest }}
          application_name: matrikkel-keycloak
          identity: matrikkel-keycloak
      - name: "Update apps repo keycloak scheduler (prod)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atkv3-prod
          namespace: mat-brukeradmin-keycloak-prod
          image_name: ${{ needs.package-image.outputs.scheduler_image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.scheduler_image_digest }}
          application_name: matrikkel-keycloak-scheduler
          identity: matrikkel-keycloak
      - name: "Verify deployment to prod"
        uses: kartverket/bygning-github-workflows/bygning-k8s-deployment-feedback@main
        with:
          cluster: atkv3-prod
          apps: |
            mat-brukeradmin-keycloak-prod:matrikkel-keycloak:${{ env.version }}

  deploy-svg:
    name: "Deploy to prod (stavanger)"
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    needs:
      - version
      - package-image
      - deploy-prod
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      version: ${{ needs.version.outputs.new_version }}
    steps:
      - name: "Update apps repo keycloak (prod stavanger)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atsvg3-prod
          namespace: mat-brukeradmin-keycloak-katastrofe
          image_name: ${{ needs.package-image.outputs.image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.image_digest }}
          application_name: matrikkel-keycloak
          identity: matrikkel-keycloak
      - name: "Update apps repo keycloak scheduler (prod stavanger)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atsvg3-prod
          namespace: mat-brukeradmin-keycloak-katastrofe
          image_name: ${{ needs.package-image.outputs.scheduler_image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.scheduler_image_digest }}
          application_name: matrikkel-keycloak-scheduler
          identity: matrikkel-keycloak

  run-pharos:
    needs:
      - package-image
    name: Run Pharos
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    steps:
      - name: "Run Pharos keycloak"
        uses: kartverket/pharos@aee5b200a4bb042954127dd1446408d2841fcc29 # v0.7.1
        with:
          trivy_category: 'matrikkel-keycloak'
          image_url: ${{ needs.package-image.outputs.image_name }}@${{ needs.package-image.outputs.image_digest }}
          disable_severity_check: true

  run-pharos-scheduler:
    needs:
      - package-image
    name: Run Pharos
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    steps:
      - name: "Run Pharos keycloak scheduler"
        uses: kartverket/pharos@aee5b200a4bb042954127dd1446408d2841fcc29 # v0.7.1
        with:
          trivy_category: 'matrikkel-keycloak-scheduler'
          image_url: ${{ needs.package-image.outputs.scheduler_image_name }}@${{ needs.package-image.outputs.scheduler_image_digest }}
          disable_severity_check: true
