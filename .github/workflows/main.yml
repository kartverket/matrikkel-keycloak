name: Deploy to All Environments

on:
  push:
    branches:
      - main
    paths-ignore: &ignore_paths
      - '.github/**'
      - '.security/**'
      - '**/*.md'
      - '.gitignore'
      - 'catalog-info.yaml'
      - 'docker-compose.yaml'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore: *ignore_paths
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/kartverket/matrikkel-keycloak
  SCHEDULER_IMAGE_NAME: ghcr.io/kartverket/matrikkel-keycloak-scheduler
  CONFIG_IMAGE_NAME: ghcr.io/kartverket/matrikkel-keycloak-config
  CONFIG_DRIFT_IMAGE_NAME: ghcr.io/kartverket/matrikkel-keycloak-config-drift

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version-string.outputs.new_version }}

    steps:
      - name: Generate version string
        id: version-string
        shell: bash
        run: |
          current_time="$(date '+%Y.%m.%d-%H.%M')"
          git_short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "new_version=${current_time}-${git_short_sha}" >> $GITHUB_OUTPUT

  test:
    name: Run extensions tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: gradle
          check-latest: 'true'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: Run extensions tests
        working-directory: ./extensions
        run: ./gradlew integrationTest

  realm-config-test:
    name: Realm config round-trip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Check for realm config
        id: check
        run: |
          if ls realm-config/base/*.json > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::realm-config/base er tom - round-trip hoppes over. Se realm-config/README.md (migrering)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.present == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to dhi.io
        if: steps.check.outputs.present == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ephemeral Keycloak image (dev-mem)
        if: steps.check.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: KC_DB=dev-mem
          tags: matrikkel-keycloak:roundtrip

      - name: Build config image
        if: steps.check.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: realm-config/
          target: apply
          load: true
          push: false
          tags: matrikkel-keycloak-config:roundtrip

      - name: Round-trip per environment
        if: steps.check.outputs.present == 'true'
        run: |
          for dir in realm-config/envs/*/; do
            env="$(basename "$dir")"
            echo "::group::Round-trip $env"
            WORK_DIR="$RUNNER_TEMP/roundtrip-$env" bash realm-config/scripts/roundtrip.sh "$env" \
              matrikkel-keycloak:roundtrip matrikkel-keycloak-config:roundtrip
            echo "::endgroup::"
          done

      - name: Upload round-trip artifacts
        if: failure() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: realm-config-roundtrip
          path: ${{ runner.temp }}/roundtrip-*
          retention-days: 5

  package-image:
    name: Build and (conditionally) Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - version
      - test
      - realm-config-test
    outputs:
      image_name: ${{ env.IMAGE_NAME }}
      scheduler_image_name: ${{ env.SCHEDULER_IMAGE_NAME }}
      config_image_name: ${{ env.CONFIG_IMAGE_NAME }}
      config_drift_image_name: ${{ env.CONFIG_DRIFT_IMAGE_NAME }}
      image_digest: ${{ steps.build-image.outputs.digest }}
      scheduler_image_digest: ${{ steps.build-scheduler-image.outputs.digest }}
      config_image_digest: ${{ steps.build-config-image.outputs.digest }}
      config_drift_image_digest: ${{ steps.build-config-drift-image.outputs.digest }}
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to dhi.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_version }}

      - name: Build Scheduler Docker image
        id: build-scheduler-image
        uses: docker/build-push-action@v7
        with:
          context: skipJobbScheduler/
          push: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.SCHEDULER_IMAGE_NAME }}:${{ needs.version.outputs.new_version }}

      - name: Check for realm config
        id: realm-config
        run: |
          if ls realm-config/base/*.json > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Config Docker image
        id: build-config-image
        if: steps.realm-config.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: realm-config/
          target: apply
          push: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.CONFIG_IMAGE_NAME }}:${{ needs.version.outputs.new_version }}

      - name: Build Config Drift Docker image
        id: build-config-drift-image
        if: steps.realm-config.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: realm-config/
          target: drift
          push: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.CONFIG_DRIFT_IMAGE_NAME }}:${{ needs.version.outputs.new_version }}

  deploy-keycloak-dev:
    name: Deploy Keycloak to Dev
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    needs:
      - version
      - package-image
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak
      image_name: ${{ needs.package-image.outputs.image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.image_digest }}
      cluster: atkv3
      env: dev
      namespace: mat-brukeradmin-keycloak-dev
      identity: matrikkel-keycloak

  deploy-scheduler-dev:
    name: Deploy Scheduler to Dev
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    needs:
      - version
      - package-image
      - deploy-keycloak-dev
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-scheduler
      image_name: ${{ needs.package-image.outputs.scheduler_image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.scheduler_image_digest }}
      cluster: atkv3
      env: dev
      namespace: mat-brukeradmin-keycloak-dev
      identity: matrikkel-keycloak

  deploy-keycloak-betatest:
    name: Deploy Keycloak to Betatest
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - version
      - package-image
      - deploy-scheduler-dev
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak
      image_name: ${{ needs.package-image.outputs.image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.image_digest }}
      cluster: atkv3
      env: prod
      namespace: mat-brukeradmin-keycloak-betatest
      identity: matrikkel-keycloak

  deploy-scheduler-betatest:
    name: Deploy Scheduler to Betatest
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - version
      - package-image
      - deploy-keycloak-betatest
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-scheduler
      image_name: ${{ needs.package-image.outputs.scheduler_image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.scheduler_image_digest }}
      cluster: atkv3
      env: prod
      namespace: mat-brukeradmin-keycloak-betatest
      identity: matrikkel-keycloak

  deploy-keycloak-prodtest:
    name: Deploy Keycloak to Prodtest
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - version
      - package-image
      - deploy-scheduler-betatest
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak
      image_name: ${{ needs.package-image.outputs.image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.image_digest }}
      cluster: atkv3
      env: prod
      namespace: mat-brukeradmin-keycloak-prodtest
      identity: matrikkel-keycloak

  deploy-scheduler-prodtest:
    name: Deploy Scheduler to Prodtest
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - version
      - package-image
      - deploy-keycloak-prodtest
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-scheduler
      image_name: ${{ needs.package-image.outputs.scheduler_image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.scheduler_image_digest }}
      cluster: atkv3
      env: prod
      namespace: mat-brukeradmin-keycloak-prodtest
      identity: matrikkel-keycloak

  # Realm-konfigurasjon som kode (realm-config/). Deployes som SKIPJob-er etter Keycloak i hvert miljø.
  # Aktiveres med repo-variabelen REALM_CONFIG_DEPLOY=true når SKIPJob-ene finnes i bygning-apps.
  deploy-config-dev:
    name: Deploy Config to Dev
    if: (github.ref_name == 'main' || github.event_name == 'workflow_dispatch') && vars.REALM_CONFIG_DEPLOY == 'true' && needs.package-image.outputs.config_image_digest != ''
    needs:
      - version
      - package-image
      - deploy-keycloak-dev
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-config
      image_name: ${{ needs.package-image.outputs.config_image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.config_image_digest }}
      cluster: atkv3
      env: dev
      namespace: mat-brukeradmin-keycloak-dev
      identity: matrikkel-keycloak

  deploy-config-drift-dev:
    name: Deploy Config Drift to Dev
    if: (github.ref_name == 'main' || github.event_name == 'workflow_dispatch') && vars.REALM_CONFIG_DEPLOY == 'true' && needs.package-image.outputs.config_drift_image_digest != ''
    needs:
      - version
      - package-image
      - deploy-keycloak-dev
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-config-drift
      image_name: ${{ needs.package-image.outputs.config_drift_image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.config_drift_image_digest }}
      cluster: atkv3
      env: dev
      namespace: mat-brukeradmin-keycloak-dev
      identity: matrikkel-keycloak

  deploy-config-betatest:
    name: Deploy Config to Betatest
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.REALM_CONFIG_DEPLOY == 'true' && needs.package-image.outputs.config_image_digest != ''
    needs:
      - version
      - package-image
      - deploy-keycloak-betatest
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-config
      image_name: ${{ needs.package-image.outputs.config_image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.config_image_digest }}
      cluster: atkv3
      env: prod
      namespace: mat-brukeradmin-keycloak-betatest
      identity: matrikkel-keycloak

  deploy-config-drift-betatest:
    name: Deploy Config Drift to Betatest
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.REALM_CONFIG_DEPLOY == 'true' && needs.package-image.outputs.config_drift_image_digest != ''
    needs:
      - version
      - package-image
      - deploy-keycloak-betatest
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-config-drift
      image_name: ${{ needs.package-image.outputs.config_drift_image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.config_drift_image_digest }}
      cluster: atkv3
      env: prod
      namespace: mat-brukeradmin-keycloak-betatest
      identity: matrikkel-keycloak

  deploy-config-prodtest:
    name: Deploy Config to Prodtest
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.REALM_CONFIG_DEPLOY == 'true' && needs.package-image.outputs.config_image_digest != ''
    needs:
      - version
      - package-image
      - deploy-keycloak-prodtest
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-config
      image_name: ${{ needs.package-image.outputs.config_image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.config_image_digest }}
      cluster: atkv3
      env: prod
      namespace: mat-brukeradmin-keycloak-prodtest
      identity: matrikkel-keycloak

  deploy-config-drift-prodtest:
    name: Deploy Config Drift to Prodtest
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.REALM_CONFIG_DEPLOY == 'true' && needs.package-image.outputs.config_drift_image_digest != ''
    needs:
      - version
      - package-image
      - deploy-keycloak-prodtest
    permissions:
      id-token: write
      contents: read
    uses: kartverket/bygning-github-workflows/.github/workflows/update-app-version.yaml@main
    with:
      application_name: matrikkel-keycloak-config-drift
      image_name: ${{ needs.package-image.outputs.config_drift_image_name }}
      image_tag: ${{ needs.version.outputs.new_version }}
      image_digest: ${{ needs.package-image.outputs.config_drift_image_digest }}
      cluster: atkv3
      env: prod
      namespace: mat-brukeradmin-keycloak-prodtest
      identity: matrikkel-keycloak

  run-pharos:
    needs:
      - package-image
    name: Run Pharos
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@aee5b200a4bb042954127dd1446408d2841fcc29 # v0.7.1
        with:
          trivy_category: 'matrikkel-keycloak'
          image_url: ${{ needs.package-image.outputs.image_name }}@${{ needs.package-image.outputs.image_digest }}
          disable_severity_check: true

  run-pharos-scheduler:
    needs:
      - package-image
    name: Run Pharos
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@aee5b200a4bb042954127dd1446408d2841fcc29 # v0.7.1
        with:
          trivy_category: 'matrikkel-keycloak-scheduler'
          image_url: ${{ needs.package-image.outputs.scheduler_image_name }}@${{ needs.package-image.outputs.scheduler_image_digest }}
          disable_severity_check: true

  run-pharos-config:
    needs:
      - package-image
    name: Run Pharos
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && needs.package-image.outputs.config_image_digest != ''
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@aee5b200a4bb042954127dd1446408d2841fcc29 # v0.7.1
        with:
          trivy_category: 'matrikkel-keycloak-config'
          image_url: ${{ needs.package-image.outputs.config_image_name }}@${{ needs.package-image.outputs.config_image_digest }}
          disable_severity_check: true