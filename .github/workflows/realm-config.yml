name: Realm config (dev)

# Bygger config-imaget og ruller det ut til dev. Bare dev i fÃ¸rste omgang (se docs/adr/0008).
on:
  push:
    branches:
      - main
    paths: &config_paths
      - 'realm-config/**'
      - '!realm-config/**/*.md'
      - '!realm-config/scripts/**'
      - '.github/workflows/realm-config.yml'
  pull_request:
    branches:
      - main
    paths: *config_paths
  workflow_dispatch:

env:
  CONFIG_IMAGE_NAME: ghcr.io/kartverket/matrikkel-keycloak-config

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version-string.outputs.new_version }}
    steps:
      - name: Generate version string
        id: version-string
        shell: bash
        run: |
          current_time="$(date '+%Y.%m.%d-%H.%M')"
          git_short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "new_version=${current_time}-${git_short_sha}" >> $GITHUB_OUTPUT

  package-image:
    name: Build and (conditionally) Push Config Image
    runs-on: ubuntu-latest
    needs:
      - version
    outputs:
      config_image_name: ${{ env.CONFIG_IMAGE_NAME }}
      config_image_digest: ${{ steps.build-config-image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Config Docker image
        id: build-config-image
        uses: docker/build-push-action@v7
        with:
          context: realm-config/
          push: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.CONFIG_IMAGE_NAME }}:${{ needs.version.outputs.new_version }}

  deploy-dev:
    name: "Deploy realm-config to dev"
    runs-on: ubuntu-latest
    # Av til repo-variabelen REALM_CONFIG_DEPLOY=true og SKIPJob-en finnes i bygning-apps.
    if: (github.ref_name == 'main' || github.event_name == 'workflow_dispatch') && vars.REALM_CONFIG_DEPLOY == 'true'
    needs:
      - version
      - package-image
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: "Update apps repo keycloak realm-config (dev)"
        uses: kartverket/bygning-github-workflows/apps-repo-deploy@main
        with:
          cluster: atkv3-dev
          namespace: mat-brukeradmin-keycloak-dev
          image_name: ${{ needs.package-image.outputs.config_image_name }}
          image_tag: ${{ needs.version.outputs.new_version }}
          image_digest: ${{ needs.package-image.outputs.config_image_digest }}
          application_name: matrikkel-keycloak-realm-config
          identity: matrikkel-keycloak

  run-pharos-config:
    name: Run Pharos
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    needs:
      - package-image
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    steps:
      - name: "Run Pharos keycloak realm-config"
        uses: kartverket/pharos@aee5b200a4bb042954127dd1446408d2841fcc29 # v0.7.1
        with:
          trivy_category: 'matrikkel-keycloak-config'
          image_url: ${{ needs.package-image.outputs.config_image_name }}@${{ needs.package-image.outputs.config_image_digest }}
          disable_severity_check: true
